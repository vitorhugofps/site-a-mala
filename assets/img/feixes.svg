<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FD4FF" stop-opacity="0"/>
      <stop offset=".45" stop-color="#9BE7FF" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#1C5BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1C5BFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5FD4FF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#1C5BFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <g filter="url(#glow)" opacity=".9">
