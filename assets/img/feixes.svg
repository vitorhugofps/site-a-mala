    <path d="M-60 700 C 240 640, 460 420, 840 300" stroke="url(#g2)" stroke-width="1.6"/>
    <path d="M-20 560 C 200 470, 420 260, 800 60" stroke="url(#g2)" stroke-width="1"/>
  </g>
